spring:
  application:
    name: e_commerce
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    # Looks for your Render variable 'DATABASE_URL' first.
    # Falls back to local defaults if it's missing (on your laptop).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce_db_sgpq}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql

