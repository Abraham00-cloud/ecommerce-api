spring:
  application:
    name: e_commerce
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    # 1. Cleanly maps individual variables to bypass password string colons parsing errors
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_db_sgpq}?sslmode=require
    username: ${DB_USER:ecommerce_db_sgpq_user}
    password: ${DB_PASSWORD:PxDXoNLUdKnsH5nNtpL3G5imFdGKnUoN}
    driver-class-name: org.postgresql.Driver
    # 2. Instructs HikariCP to try connecting for up to 30 seconds before crashing the app context
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Note: Hibernate dialect explicitly omitted here since Hibernate 6+ automatically detects PostgreSQL natively!
    database: postgresql

